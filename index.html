<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مواقيت الصلاة والإقامة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b132b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1c2541;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid #3a506b;
            position: relative;
        }
        .live-clock {
            font-size: 1.4rem;
            font-weight: bold;
            color: #48cae4;
            background-color: #0b132b;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            letter-spacing: 1px;
            border: 1px solid #3a506b;
            direction: ltr;
        }
        h1 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .hadith {
            font-size: 0.9em;
            color: #90e0ef;
            border-bottom: 2px solid #3a506b;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .status-box {
            background: linear-gradient(135deg, #0077b6, #023e8a);
            padding: 18px;
            border-radius: 14px;
            font-size: 1.15em;
            font-weight: bold;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 119, 182, 0.4);
            line-height: 1.6;
            word-break: break-word;
        }
        .warning {
            background: linear-gradient(135deg, #d97706, #b45309) !important;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
        }
        .iqama-active {
            background: linear-gradient(135deg, #15803d, #166534) !important;
            box-shadow: 0 4px 15px rgba(21, 128, 61, 0.4);
        }
        .prayer-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .prayer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background-color: #0b132b;
            border-radius: 12px;
            border: 1px solid #1c2541;
            font-size: 1.1em;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: transform 0.2s ease, border-color 0.3s ease, background-color 0.2s ease;
        }
        .prayer-row:hover {
            border-color: #48cae4;
            background-color: #162238;
        }
        .prayer-row:active {
            transform: scale(0.98);
        }
        .prayer-row.next {
            border: 2px solid #48cae4;
            background-color: #1e293b;
            box-shadow: 0 0 12px rgba(72, 202, 228, 0.3);
            transform: scale(1.02);
        }
        .prayer-name {
            font-weight: bold;
            color: #e0e1dd;
        }
        .prayer-time {
            color: #48cae4;
            font-weight: bold;
            direction: ltr;
        }

        /* واجهة شريط التحميل للتحديث التلقائي */
        .update-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 19, 43, 0.95);
            border-radius: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .progress-bar-container {
            width: 80%;
            height: 12px;
            background-color: #1c2541;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #48cae4;
            margin-top: 15px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #48cae4;
            transition: width 0.2s ease;
        }
        .update-text {
            color: #48cae4;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="updateOverlay" class="update-overlay">
        <div class="update-text" id="updateText">جاري تحميل التحديث... 0%</div>
        <div class="progress-bar-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
    </div>

    <div class="live-clock" id="liveClock">--:--:-- --</div>
    <h1>مواقيت الصلاة</h1>
    <div class="hadith">"إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًا مَّوْقُوتًا"</div>
    <div id="status" class="status-box">جاري تحميل المواقيت...</div>
    <div class="prayer-list" id="prayerList"></div>
</div>

<script>
    const APP_VERSION = "1.0.0"; 
    // استبدل يوسيفيش وحسابك بالاسم الحقيقي على جيت هاب لاحقاً
    const UPDATE_URL = "https://raw.githubusercontent.com/youseffish54-cloud/pray-pro/main/version.json";

    const iqamaMinutes = {
        Fajr: 25,
        Sunrise: 0,
        Dhuhr: 20,
        Asr: 20,
        Maghrib: 15,
        Isha: 20
    };

    const prayerNamesAr = {
        Fajr: "الفجر",
        Sunrise: "الشروق",
        Dhuhr: "الظهر",
        Asr: "العصر",
        Maghrib: "المغرب",
        Isha: "العشاء"
    };

    let prayerTimes = {};
    let lastFetchedDate = null;
    let previewTimeout = null;
    let isPreviewing = false;
    let currentActivePrayerKey = null;

    const liveClockEl = document.getElementById('liveClock');
    const statusBoxEl = document.getElementById('status');
    const prayerListEl = document.getElementById('prayerList');

    async function checkForUpdates() {
        try {
            const res = await fetch(UPDATE_URL + "?t=" + new Date().getTime());
            if (!res.ok) return;
            const data = await res.json();

            if (data.version && data.version !== APP_VERSION) {
                showUpdateProgress();
            }
        } catch (e) {}
    }

    function showUpdateProgress() {
        const overlay = document.getElementById('updateOverlay');
        const progressBar = document.getElementById('progressBar');
        const updateText = document.getElementById('updateText');
        overlay.style.display = 'flex';

        let progress = 0;
        const interval = setInterval(() => {
            progress += 10;
            progressBar.style.width = progress + '%';
            updateText.textContent = `جاري تحميل التحديث... ${progress}%`;

            if (progress >= 100) {
                clearInterval(interval);
                setTimeout(() => {
                    location.reload(true);
                }, 500);
            }
        }, 150);
    }

    function updateLiveClock(now = new Date()) {
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        
        hours = hours % 12 || 12;
        const hoursStr = String(hours).padStart(2, '0');

        liveClockEl.textContent = `${hoursStr}:${minutes}:${seconds} ${ampm}`;
    }

    function subtractOneHour(time24) {
        let [hours, minutes] = time24.split(':').map(Number);
        hours = hours - 1;
        if (hours < 0) hours = 23;
        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
    }

    function convertTo12Hour(time24) {
        let [hours, minutes] = time24.split(':');
        hours = parseInt(hours, 10);
        const period = hours >= 12 ? 'م' : 'ص';
        hours = hours % 12 || 12;
        return `${hours}:${minutes} ${period}`;
    }

    function formatRemainingTime(hours, mins, secs) {
        const parts = [];
        if (hours > 0) {
            if (hours === 1) parts.push("ساعة");
            else if (hours === 2) parts.push("ساعتين");
            else if (hours >= 3 && hours <= 10) parts.push(`${hours} ساعات`);
            else parts.push(`${hours} ساعة`);
        }

        if (mins > 0) {
            if (mins === 1) parts.push("دقيقة");
            else if (mins === 2) parts.push("دقيقتين");
            else if (mins >= 3 && mins <= 10) parts.push(`${mins} دقائق`);
            else parts.push(`${mins} دقيقة`);
        }

        if (secs > 0 || parts.length === 0) {
            if (secs === 1) parts.push("ثانية واحدة");
            else if (secs === 2) parts.push("ثانيتين");
            else if (secs >= 3 && secs <= 10) parts.push(`${secs} ثواني`);
            else parts.push(`${secs} ثانية`);
        }

        return parts.join(' و ');
    }

    function loadCachedPrayerTimes() {
        try {
            const cachedData = localStorage.getItem('prayerTimesData');
            const cachedDate = localStorage.getItem('prayerTimesDate');
            if (cachedData && cachedDate === new Date().toDateString()) {
                prayerTimes = JSON.parse(cachedData);
                lastFetchedDate = cachedDate;
                renderList();
                updateTracker();
                return true;
            }
        } catch (e) {}
        return false;
    }

    async function fetchPrayerTimes() {
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 7000);

            const response = await fetch('https://api.aladhan.com/v1/timingsByCity?city=Cairo&country=Egypt&method=5', {
                signal: controller.signal
            });
            clearTimeout(timeoutId);

            if (!response.ok) throw new Error('تعذر الاتصال بالمزود');
            
            const data = await response.json();
            const timings = data.data.timings;

            prayerTimes = {
                Fajr: subtractOneHour(timings.Fajr),
                Sunrise: subtractOneHour(timings.Sunrise),
                Dhuhr: subtractOneHour(timings.Dhuhr),
                Asr: subtractOneHour(timings.Asr),
                Maghrib: subtractOneHour(timings.Maghrib),
                Isha: subtractOneHour(timings.Isha)
            };

            const todayStr = new Date().toDateString();
            lastFetchedDate = todayStr;
            
            try {
                localStorage.setItem('prayerTimesData', JSON.stringify(prayerTimes));
                localStorage.setItem('prayerTimesDate', todayStr);
            } catch (e) {}

            renderList();
            updateTracker();
        } catch (error) {
            if (Object.keys(prayerTimes).length === 0) {
                statusBoxEl.innerText = "تعذر جلب المواقيت. جاري إعادة المحاولة...";
            }
            setTimeout(fetchPrayerTimes, 5000);
        }
    }

    function timeToDate(timeStr, baseDate) {
        const [hours, minutes] = timeStr.split(':');
        const d = new Date(baseDate);
        d.setHours(parseInt(hours, 10), parseInt(minutes, 10), 0, 0);
        return d;
    }

    function handlePrayerClick(key) {
        if (!prayerTimes[key]) return;

        if (previewTimeout) clearTimeout(previewTimeout);

        isPreviewing = true;

        document.querySelectorAll('.prayer-row').forEach(row => row.classList.remove('next'));
        const clickedRow = document.getElementById(`row-${key}`);
        if (clickedRow) clickedRow.classList.add('next');

        const now = new Date();
        let targetTime = timeToDate(prayerTimes[key], now);

        if (key === currentActivePrayerKey || targetTime <= now) {
            targetTime.setDate(targetTime.getDate() + 1);
        }

        const diffMs = targetTime - now;
        const totalSecs = Math.floor(diffMs / 1000);
        const hours = Math.floor(totalSecs / 3600);
        const mins = Math.floor((totalSecs % 3600) / 60);
        const secs = totalSecs % 60;

        const timeFormatted = formatRemainingTime(hours, mins, secs);

        statusBoxEl.className = "status-box";
        statusBoxEl.textContent = `متبقي على ${prayerNamesAr[key]}: ${timeFormatted}`;

        previewTimeout = setTimeout(() => {
            isPreviewing = false;
            updateTracker();
        }, 1750);
    }

    function renderList() {
        const fragment = document.createDocumentFragment();
        prayerListEl.innerHTML = '';

        for (const key in prayerTimes) {
            const row = document.createElement('div');
            row.className = 'prayer-row';
            row.id = `row-${key}`;

            row.addEventListener('click', () => handlePrayerClick(key));

            const nameSpan = document.createElement('span');
            nameSpan.className = 'prayer-name';
            nameSpan.textContent = prayerNamesAr[key];

            const timeSpan = document.createElement('span');
            timeSpan.className = 'prayer-time';
            timeSpan.textContent = convertTo12Hour(prayerTimes[key]);

            row.appendChild(nameSpan);
            row.appendChild(timeSpan);
            fragment.appendChild(row);
        }

        prayerListEl.appendChild(fragment);
    }

    function updateTracker() {
        const now = new Date();
        updateLiveClock(now);

        if (lastFetchedDate && lastFetchedDate !== now.toDateString()) {
            fetchPrayerTimes();
            return;
        }

        if (Object.keys(prayerTimes).length === 0) return;

        let activePrayer = null;
        let activePrayerTime = null;

        const keys = Object.keys(prayerTimes);
        
        for (const key of keys) {
            const pTime = timeToDate(prayerTimes[key], now);
            const iqamaDuration = (iqamaMinutes[key] || 0) * 60 * 1000;
            
            if (now < new Date(pTime.getTime() + iqamaDuration)) {
                activePrayer = key;
                activePrayerTime = pTime;
                break;
            }
        }

        if (!activePrayer) {
            activePrayer = 'Fajr';
            activePrayerTime = timeToDate(prayerTimes['Fajr'], now);
            activePrayerTime.setDate(activePrayerTime.getDate() + 1);
        }

        currentActivePrayerKey = activePrayer;

        if (!isPreviewing) {
            document.querySelectorAll('.prayer-row').forEach(row => row.classList.remove('next'));
            const activeRow = document.getElementById(`row-${activePrayer}`);
            if (activeRow) activeRow.classList.add('next');

            statusBoxEl.className = "status-box";

            const diffMs = activePrayerTime - now;

            if (diffMs <= 0) {
                const iqamaMs = (iqamaMinutes[activePrayer] * 60 * 1000) + diffMs;
                const iqamaTotalSecs = Math.max(0, Math.floor(iqamaMs / 1000));
                const iqamaMinsLeft = Math.floor(iqamaTotalSecs / 60);
                const iqamaSecsLeft = iqamaTotalSecs % 60;

                statusBoxEl.classList.add('iqama-active');
                statusBoxEl.textContent = `حان الآن وقت أذان ${prayerNamesAr[activePrayer]} - متبقي على الإقامة: ${iqamaMinsLeft} دقيقة و ${iqamaSecsLeft} ثانية`;
            } 
            else {
                const totalSecs = Math.floor(diffMs / 1000);
                const hours = Math.floor(totalSecs / 3600);
                const mins = Math.floor((totalSecs % 3600) / 60);
                const secs = totalSecs % 60;

                if (hours === 0 && mins < 5) {
                    statusBoxEl.classList.add('warning');
                    statusBoxEl.textContent = `تنبيه: متبقي على ${prayerNamesAr[activePrayer]} ${mins} دقيقة و ${secs} ثانية!`;
                } else {
                    const timeFormatted = formatRemainingTime(hours, mins, secs);
                    statusBoxEl.textContent = `متبقي على ${prayerNamesAr[activePrayer]}: ${timeFormatted}`;
                }
            }
        }
    }

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            updateTracker();
        }
    });

    updateLiveClock();
    setInterval(updateTracker, 1000);

    const hasCache = loadCachedPrayerTimes();
    if (!hasCache) {
        fetchPrayerTimes();
    }

    checkForUpdates();
    setInterval(checkForUpdates, 30000);
</script>

</body>
</html>
